import groovy.json.JsonOutput

def loaderName = projectDir.parentFile.name
def minecraftVersion = projectDir.name
def fixtureAccessors = file("../../mod-common/${minecraftVersion}/src/integration/java/dev/eyecrasher/fixture/mixin/ConnectionAccess.java").isFile()
def fixturePortalAccessors = file("../../mod-common/${minecraftVersion}/src/integration/java/dev/eyecrasher/fixture/mixin/PortalContactAccess.java").isFile()
def fixtureCompatibility = project.findProperty('portallinkedFixtureCompatibility') ?: 'JAVA_21'
def neoLegacyMetadata = project.findProperty('portallinkedNeoLegacyMetadata') ?: false
def fixtureRefmap = project.findProperty('portallinkedFixtureRefmap')
def generatedMetadata = layout.buildDirectory.dir('generated/integration-metadata')

sourceSets {
    integration {
        java.srcDirs "../../mod-common/${minecraftVersion}/src/integration/java", 'src/integration/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}

tasks.register('integrationMetadata') {
    inputs.property 'minecraft', minecraftVersion
    inputs.property 'loader', loaderName
    inputs.property 'fixtureAccessors', fixtureAccessors
    inputs.property 'fixturePortalAccessors', fixturePortalAccessors
    inputs.property 'fixtureCompatibility', fixtureCompatibility
    inputs.property 'neoLegacyMetadata', neoLegacyMetadata
    inputs.property 'fixtureRefmap', fixtureRefmap ?: ''
    outputs.dir generatedMetadata
    doLast {
        def output = generatedMetadata.get().asFile
        project.delete(output)
        output.mkdirs()
        def mixinMetadata = [
            required: true, minVersion: '0.8', package: 'dev.eyecrasher.fixture.mixin',
            compatibilityLevel: fixtureCompatibility, server: ['ServerTickFixtureMixin', 'CancelTeleportFixtureMixin']
                    + (fixtureAccessors ? ['ConnectionAccess', 'PlayerListAccess'] : [])
                    + (fixturePortalAccessors ? ['PortalContactAccess'] : []),
            injectors: [defaultRequire: 1]
        ]
        if (fixtureRefmap) mixinMetadata.refmap = fixtureRefmap
        new File(output, 'portallinked.integration.mixins.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(mixinMetadata))
        if (loaderName == 'fabric') {
            new File(output, 'fabric.mod.json').text = JsonOutput.prettyPrint(JsonOutput.toJson([
                schemaVersion: 1, id: 'portallinked_integration', version: '1', name: 'PortalLinked integration fixture',
                environment: 'server', license: 'GPL-3.0-only', mixins: ['portallinked.integration.mixins.json'],
                depends: [portallinked: '*', minecraft: minecraftVersion, fabricloader: '>=0.20.1']
            ]))
        } else {
            def target = new File(output, loaderName == 'forge' || neoLegacyMetadata ? 'META-INF/mods.toml' : 'META-INF/neoforge.mods.toml')
            target.parentFile.mkdirs()
            target.text = '''modLoader="javafml"
loaderVersion="[1,)"
license="GPL-3.0-only"
[[mods]]
modId="portallinked_integration"
version="1"
displayName="PortalLinked integration fixture"
description="Disposable test server fixture."
'''
            if (loaderName == 'neoforge' && !neoLegacyMetadata) target << '\n[[mixins]]\nconfig="portallinked.integration.mixins.json"\n'
        }
    }
}

tasks.register('integrationFixture', Jar) {
    dependsOn tasks.named('jar'), tasks.named('integrationClasses'), tasks.named('integrationMetadata')
    archiveBaseName = 'portallinked-integration-' + loaderName
    archiveVersion = '1'
    from sourceSets.integration.output
    from generatedMetadata
    if (loaderName == 'forge' || neoLegacyMetadata) manifest { attributes 'MixinConfigs': 'portallinked.integration.mixins.json' }
}
