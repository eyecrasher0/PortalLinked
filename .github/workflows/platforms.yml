name: Platform verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bukkit:
    name: Bukkit / ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [paper, spigot, purpur, folia]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and unit tests
        working-directory: bukkit/26.3
        run: ./gradlew clean build --console=plain
      - name: Native portal transitions and restart
        working-directory: bukkit/26.3
        run: python3 tools/integration.py --accept-eula --engine '${{ matrix.engine }}'
      - name: Upload runtime JAR and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portallinked-bukkit-${{ matrix.engine }}-26.3
          path: |
            bukkit/26.3/build/libs/portallinked-bukkit-1.1.0+26.3.jar
            bukkit/26.3/build/integration-${{ matrix.engine }}/result.json
            bukkit/26.3/build/integration-${{ matrix.engine }}/run-*/console-*.log
  mods:
    name: Mod / ${{ matrix.loader }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge, forge]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Build mod and separate native fixture
        working-directory: ${{ matrix.loader }}/26.3
        run: ./gradlew clean build integrationFixture --console=plain
      - name: Native portal transitions and restart
        run: python3 tools/mod-integration.py --loader '${{ matrix.loader }}' --accept-eula
      - name: Upload runtime JAR and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portallinked-${{ matrix.loader }}-26.3
          path: |
            ${{ matrix.loader }}/26.3/build/libs/portallinked-${{ matrix.loader }}-1.1.0+26.3.jar
            ${{ matrix.loader }}/26.3/build/integration/result.json
            ${{ matrix.loader }}/26.3/build/integration/run-*/console-*.log
