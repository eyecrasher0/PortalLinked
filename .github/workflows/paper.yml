name: Paper verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test
        working-directory: paper/26.3
        run: ./gradlew clean build --console=plain
      - name: Native portal transitions and restart
        working-directory: paper/26.3
        run: python3 tools/integration.py --accept-eula
      - name: Upload release JAR and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portallinked-paper-26.3
          path: |
            paper/26.3/build/libs/portallinked-paper-1.0.0+26.3.jar
            paper/26.3/build/integration/result.json
            paper/26.3/build/integration/run-*/console-*.log
