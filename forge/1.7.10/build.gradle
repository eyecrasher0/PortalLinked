buildscript {
 repositories { maven { url='https://maven.minecraftforge.net/' }; maven { url='https://repo.maven.apache.org/maven2/' } }
 dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-20211118.175523-305' }
}
apply plugin: 'forge'
group='dev.eyecrasher.portallinked'
version='1.2.0+1.7.10'
archivesBaseName='portallinked-forge'
sourceCompatibility=targetCompatibility='1.8'
minecraft { version='1.7.10-10.13.4.1614-1.7.10'; runDir='run' }
getVersionJson.url = 'https://piston-meta.mojang.com/v1/packages/ed5d8789ed29872ea2ef1c348302b0c55e3f3468/1.7.10.json'
getAssetsIndex.url = 'https://launchermeta.mojang.com/v1/packages/1863782e33ce7b584fc45b037325a1964e095d3e/1.7.10.json'
downloadClient.url = new net.minecraftforge.gradle.delayed.DelayedString(project, 'https://launcher.mojang.com/v1/objects/e80d9b3bf5085002218d4be59e668bac718abbc6/client.jar')
downloadServer.url = new net.minecraftforge.gradle.delayed.DelayedString(project, 'https://launcher.mojang.com/v1/objects/952438ac4e01b4d115c5fc38f891710c4941df29/server.jar')

tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand version: project.version
    }
    from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' }
    from('../../branding/icon.png')
}
jar {
    manifest {
        attributes 'FMLCorePlugin': 'dev.eyecrasher.portallinked.core.PortalLinkedCore',
                'FMLCorePluginContainsFMLMod': 'true'
    }
}
task sourcesJar(type: Jar) {
    classifier = 'sources'
    from sourceSets.main.allSource
}
tasks.withType(AbstractArchiveTask) { from(files('LICENSE', 'NOTICE')) { into 'META-INF' } }
assemble.dependsOn sourcesJar

sourceSets {
    integration { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath }
}
task integrationFixture(type: Jar) {
    dependsOn classes, integrationClasses
    baseName = 'portallinked-integration-forge'
    version = '1'
    from sourceSets.integration.output
    manifest {
        attributes 'FMLCorePlugin': 'dev.eyecrasher.fixture.core.CancellationCore',
                'FMLCorePluginContainsFMLMod': 'true'
    }
}
reobf {
    reobf(integrationFixture) { spec ->
        spec.classpath = project.sourceSets.integration.compileClasspath + project.sourceSets.integration.output
    }
}

afterEvaluate {
    reobf.obfOutput.each { artifact ->
        artifact.classpath = sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.integration.output
    }
}
