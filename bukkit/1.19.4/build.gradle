plugins {
    id 'java'
}

group = 'dev.eyecrasher.portallinked'
version = '1.2.0+1.19.4'
base { archivesName = 'portallinked-bukkit' }

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
}

// The exact Folia API supplies its scheduler methods alongside the shared Bukkit API.
dependencies {
    compileOnly 'dev.folia:folia-api:1.19.4-R0.1-SNAPSHOT'
    testImplementation 'dev.folia:folia-api:1.19.4-R0.1-SNAPSHOT'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('processResources') {
    filesMatching('plugin.yml') { expand(version: project.version) }
}

tasks.named('test') { useJUnitPlatform() }

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(files('LICENSE', 'NOTICE')) { into 'META-INF' }
}
