plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

group = 'dev.eyecrasher.portallinked'
version = '1.2.0+1.20.4'
base { archivesName = 'portallinked-neoforge' }

repositories { mavenCentral() }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}
dependencies { implementation 'net.neoforged:neoforge:20.4.253' }
sourceSets.main {
    java.srcDir '../../mod-common/1.20.4/src/main/java'
    resources.srcDir '../../mod-common/1.20.4/src/main/resources'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
processResources {
    filesMatching('META-INF/mods.toml') { expand version: project.version }
    from('../../branding/icon.png')
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(files('LICENSE', 'NOTICE')) { into 'META-INF' }
}

ext.portallinkedFixtureCompatibility = 'JAVA_17'
ext.portallinkedNeoLegacyMetadata = true
jar { manifest { attributes 'MixinConfigs': 'portallinked.mixins.json,portallinked.travel.mixins.json' } }
apply from: '../../gradle/mod-integration.gradle'
